name: Test PDF catalog reconciliation

on:
  pull_request:
    paths:
      - 'index.html'
      - 'pdfs.json'
      - 'scripts/pdf-catalog.mjs'
      - 'tests/test-pdf-catalog.mjs'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'pdfs.json'
      - 'scripts/pdf-catalog.mjs'
      - 'tests/test-pdf-catalog.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test catalog consistency
        run: node --test tests/test-pdf-catalog.mjs
