name: Build PDF search assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'indeedmarketreports/**'
      - 'scripts/build-search-index.mjs'
      - 'scripts/build-page-previews.py'
      - 'scripts/build-keyword-data.py'
      - 'scripts/diagnose-area-ranking.py'
      - 'scripts/export-keyword-csv.py'
      - 'tests/test_keyword_export.py'
      - '.github/workflows/build-pdf-search-index.yml'

permissions:
  contents: write

concurrency:
  group: pdf-search-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF.js for the search index builder
        run: npm install --no-save --no-package-lock --ignore-scripts pdfjs-dist@5.6.205

      - name: Install Python PDF / preview dependencies
        run: python -m pip install --disable-pip-version-check pymupdf pillow numpy

      - name: Install Japanese OCR support for keyword rankings
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn

      - name: Diagnose region ranking extraction
        run: python scripts/diagnose-area-ranking.py

      - name: Test keyword export logic
        run: python -m unittest discover -s tests -p 'test_keyword_export.py' -v

      - name: Build search index
        env:
          PDF_BASE_DIR: indeedmarketreports/
          SEARCH_INDEX_DIR: search-index
          INDEX_BUILD_CONCURRENCY: '2'
        run: node scripts/build-search-index.mjs

      - name: Build page previews
        env:
          PDF_BASE_DIR: indeedmarketreports/
          PAGE_PREVIEW_DIR: page-previews
          PAGE_PREVIEW_WIDTH: '800'
          PAGE_PREVIEW_QUALITY: '50'
          PAGE_PREVIEW_CONCURRENCY: '2'
        run: python scripts/build-page-previews.py

      - name: Build keyword copy data
        env:
          PDF_BASE_DIR: indeedmarketreports/
          KEYWORD_DATA_DIR: keyword-data
          KEYWORD_OCR_SCALE: '12'
        run: python scripts/build-keyword-data.py

      - name: Commit generated search assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first so newly-created files are included in the change check.
          git add -A search-index page-previews keyword-data

          if git diff --cached --quiet -- search-index page-previews keyword-data; then
            echo "Generated PDF assets are already up to date."
            exit 0
          fi

          git commit -m "chore: update PDF search assets [skip ci]"
          git push

      - name: Confirm private CSV repository token
        env:
          PRIVATE_TOKEN: ${{ secrets.KEYWORD_CSV_REPO_TOKEN }}
        run: |
          if [ -z "$PRIVATE_TOKEN" ]; then
            echo "::error::KEYWORD_CSV_REPO_TOKEN secret is not configured in pdf-text-jump."
            exit 1
          fi

      - name: Checkout private keyword archive
        uses: actions/checkout@v4
        with:
          repository: tsicb/indeed-keyword-csv
          ref: main
          token: ${{ secrets.KEYWORD_CSV_REPO_TOKEN }}
          path: keyword-private

      - name: Build accumulated keyword CSV exports
        run: python scripts/export-keyword-csv.py --output-repo keyword-private

      - name: Commit private keyword history and CSV exports
        working-directory: keyword-private
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A keyword-history exports
          if git diff --cached --quiet -- keyword-history exports; then
            echo "Private keyword exports are already up to date."
            exit 0
          fi
          git commit -m "chore: archive keyword ranking data"
          git push origin main
