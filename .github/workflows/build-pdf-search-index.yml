name: Build PDF search index

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'indeedmarketreports/**'
      - 'scripts/build-search-index.mjs'
      - '.github/workflows/build-pdf-search-index.yml'

permissions:
  contents: write

concurrency:
  group: pdf-search-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF.js for the index builder
        run: npm install --no-save --no-package-lock --ignore-scripts pdfjs-dist@5.6.205

      - name: Build search index
        env:
          PDF_BASE_DIR: indeedmarketreports/
          SEARCH_INDEX_DIR: search-index
          INDEX_BUILD_CONCURRENCY: '2'
        run: node scripts/build-search-index.mjs

      - name: Commit generated index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add generated files first so newly-created (untracked) search-index files
          # are included in the change check.
          git add -A search-index

          if git diff --cached --quiet -- search-index; then
            echo "Search index is already up to date."
            exit 0
          fi

          git commit -m "chore: update PDF search index [skip ci]"
          git push
